<div class="container mt-4">
  <div class="row mb-4">
    <div class="col-12 d-flex justify-content-between align-items-center">
      <h1>Lista de Tareas</h1>
      <button mat-raised-button color="primary" (click)="openTaskForm()">
        <fa-icon [icon]="faPlus"></fa-icon> Nueva Tarea
      </button>
    </div>
  </div>

  <!-- Lista de tareas -->
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Tareas</h5>
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Título</th>
                  <th>Descripción</th>
                  <th>Estado</th>
                  <th>Fecha de Creación</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let task of tasks">
                  <td>{{ task.title }}</td>
                  <td>{{ task.description }}</td>
                  <td>
                    <span class="badge" [ngClass]="{
                      'bg-warning': task.status === TaskStatus.PENDING,
                      'bg-info': task.status === TaskStatus.IN_PROGRESS,
                      'bg-success': task.status === TaskStatus.COMPLETED
                    }">
                      {{ task.status }}
                    </span>
                  </td>
                  <td>{{ task.createdAt._seconds * 1000 | date:'medium' }}</td>
                  <td>
                    <div class="btn-group" role="group">
                      <button class="btn btn-warning btn-sm" (click)="openTaskForm(task)">
                        <fa-icon [icon]="faEdit"></fa-icon>
                      </button>
                      <button class="btn btn-danger btn-sm" (click)="deleteTask(task.id)">
                        <fa-icon [icon]="faTrash"></fa-icon>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
